# CI: lint → тесты (postgres 16) → сборка/валидация документов.
# DEVELOPMENT_PLAN §1.2: «GitHub Actions: lint → тесты → сборка → деплой»;
# деплой добавляется отдельно (фаза 5), здесь — первые три звена.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    name: ruff + compileall
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: ruff check docker
        run: |
          python -m pip install --quiet ruff mypy
          ruff check docker
      - name: mypy (ядро admin_core)
        run: python -m mypy docker/core/admin_core --ignore-missing-imports
      - name: синтаксис всего кода
        run: python -m compileall -q docker/core docker/services

  test:
    name: pytest (юнит + интеграция с БД)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: aiadmin
          POSTGRES_PASSWORD: aiadmin_dev
          POSTGRES_DB: aiadmin
        ports:
          - "5432:5432"
        options: >-
          --health-cmd "pg_isready -U aiadmin -d aiadmin"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    env:
      DATABASE_URL: postgresql://aiadmin:aiadmin_dev@localhost:5432/aiadmin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: зависимости cli (тестовое окружение)
        run: python -m pip install --quiet -r docker/services/cli/requirements.txt
      - name: схема БД (init 001-004, как docker-entrypoint-initdb.d)
        run: python docker/scripts/init_schema.py
      - name: pytest
        working-directory: docker/core
        run: python -m pytest -q

  # Правила алертов: promtool без контейнера не запустить, поэтому шаг живёт
  # здесь, а не в lint. Правило с неверным выражением молчит при аварии —
  # и заметить это можно только post factum.
  alerts:
    name: алерты promtool (конфиг + правила)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: promtool check config
        run: |
          docker run --rm --entrypoint promtool \
            -v "$PWD/docker/monitoring:/etc/prometheus" \
            prom/prometheus:latest \
            check config /etc/prometheus/prometheus.yml
      - name: promtool test rules (правила должны срабатывать)
        run: |
          docker run --rm --entrypoint promtool \
            -v "$PWD/docker/monitoring:/etc/prometheus" \
            prom/prometheus:latest \
            test rules /etc/prometheus/alerts_test.yml

  deploy_ready:
    name: готовность деплоя
    # Секреты GitHub недоступны в условии job, поэтому проверяем их отдельным
    # шагом: пустой DEPLOY_HOST = деплоить некуда, job выключается.
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ steps.check.outputs.enabled }}
    steps:
      - id: check
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          if [ -n "$DEPLOY_HOST" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "сервер задан: деплой включён"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "DEPLOY_HOST не задан: деплой пропускается"
          fi

  deploy:
    name: деплой на прод (по ssh)
    # Только main и только если всё зелёное: тесты обязаны пройти до выкатки.
    # Пока секреты деплоя не заведены, job пропускается: иначе каждый пуш в main
    # давал бы красный статус из-за отсутствия сервера, и статус CI перестал бы
    # что-то значить. Включается переменной окружения DEPLOY_ENABLED=true.
    needs: [lint, test, docs, alerts, deploy_ready]
    if: >-
      github.ref == 'refs/heads/main' && github.event_name == 'push'
      && needs.deploy_ready.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: деплой
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
          # Бэкап ДО выкатки: откат кода без отката данных невозможен.
          ssh "$DEPLOY_USER@$DEPLOY_HOST" "cd '$DEPLOY_PATH/docker' \
            && powershell -ExecutionPolicy Bypass -File scripts/backup_db.ps1"
          rsync -az --delete --exclude .git --exclude .env --exclude backups \
            --exclude 'certs' --exclude '*.log' ./ "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/"
          ssh "$DEPLOY_USER@$DEPLOY_HOST" "cd '$DEPLOY_PATH/docker' \
            && powershell -ExecutionPolicy Bypass -File scripts/deploy.ps1"
      - name: автооткат при неудачной выкатке
        # Скрипт сам сохраняет образы до выкатки и возвращает их, если сервисы
        # не поднялись. Без этого шага «успешный» деплой мог оставить прод в
        # рестарт-листе, и заметить это можно было бы только по жалобам.
        if: failure()
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
          ssh "$DEPLOY_USER@$DEPLOY_HOST" "cd '$DEPLOY_PATH/docker' \
            && ls -1dt deploy-backup/* | head -1 \
            && for tar in \$(ls -1dt deploy-backup/* | head -1)/*.tar; do docker load -i \$tar; done \
            && docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --force-recreate"
      - name: уведомление
        if: always()
        run: echo "деплой ${{ github.sha }} завершён с кодом ${{ job.status }}"

  docs:
    name: сборка и валидация документов
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: build 13 документов + validate
        run: |
          python build_html_docs.py
          python validate_plan_html.py
      - name: сгенерированный HTML совпадает с репозиторием
        run: git diff --exit-code -- "*.html"
