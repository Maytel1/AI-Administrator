# AI-администратор: локальный dev-стек (фаза 0). См. docker/README.md
# Запуск:  docker compose up -d      Стоп: docker compose down (данные БД остаются)
name: ai-admin

services:
  postgres:
    image: postgres:16-alpine
    container_name: ai-admin-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-aiadmin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aiadmin_dev}
      POSTGRES_DB: ${POSTGRES_DB:-aiadmin}
      TZ: Asia/Yekaterinburg
      PGTZ: Asia/Yekaterinburg
      POSTGRES_INITDB_ARGS: "--encoding=UTF8"
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aiadmin} -d ${POSTGRES_DB:-aiadmin}"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  bot-service:
    build:
      context: .
      dockerfile: services/bot-service/Dockerfile
    container_name: ai-admin-bot
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-aiadmin}:${POSTGRES_PASSWORD:-aiadmin_dev}@postgres:5432/${POSTGRES_DB:-aiadmin}
      SERVICE_NAME: bot-service
    env_file:
      - path: .env
        required: false
    ports:
      - "127.0.0.1:${BOT_HTTP_PORT:-8080}:8080"   # только localhost: webhook появится в фазе 2
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: services/web/Dockerfile
    container_name: ai-admin-web
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-aiadmin}:${POSTGRES_PASSWORD:-aiadmin_dev}@postgres:5432/${POSTGRES_DB:-aiadmin}
      SERVICE_NAME: web
      WEB_HTTP_PORT: 8080
      MIGRATIONS_DIR: /app/migrations
      # TLS: сертификаты кладём через docker/certs (в git не попадают).
      # Без них панель работает по http — только для локальной отладки.
      WEB_TLS_CERT: ${WEB_TLS_CERT:-}
      WEB_TLS_KEY: ${WEB_TLS_KEY:-}
      WEB_TRUST_PROXY: ${WEB_TRUST_PROXY:-0}
    env_file:
      - path: .env
        required: false
    volumes:
      - ./certs:/app/certs:ro
    ports:
      - "127.0.0.1:${WEB_HTTP_PORT:-8082}:8080"      # панель: http://localhost:8082/today
      - "127.0.0.1:${WEB_HEALTH_PORT:-8083}:8081"   # /health и /metrics соседним портом
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    container_name: ai-admin-nginx
    # Единственный сервис с публичными портами (80/443): терминация TLS,
    # rate-limit на /login, скрытие заголовков. Остальные сервисы в compose
    # привязаны к 127.0.0.1 и наружу не светятся.
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./certs:/etc/nginx/certs:ro
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/proxy_params_default:/etc/nginx/proxy_params_default:ro
      - ./nginx/acme:/var/www/certbot:ro
      - ./nginx/options-ssl-params.conf:/etc/nginx/snippets/options-ssl-params.conf:ro
    depends_on:
      - web
    healthcheck:
      test: ["CMD-SHELL", "nginx -t || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  whatsapp:
    build:
      context: .
      dockerfile: services/whatsapp/Dockerfile
    container_name: ai-admin-whatsapp
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-aiadmin}:${POSTGRES_PASSWORD:-aiadmin_dev}@postgres:5432/${POSTGRES_DB:-aiadmin}
      SERVICE_NAME: whatsapp
      LLM_PROVIDER: ${LLM_PROVIDER:-}
      # Токены Meta Cloud API: без них сервис не стартует (проверка required()).
      WHATSAPP_TOKEN: ${WHATSAPP_TOKEN:-}
      WHATSAPP_PHONE_NUMBER_ID: ${WHATSAPP_PHONE_NUMBER_ID:-}
      WHATSAPP_VERIFY_TOKEN: ${WHATSAPP_VERIFY_TOKEN:-}
      WHATSAPP_APP_SECRET: ${WHATSAPP_APP_SECRET:-}
      WHATSAPP_HTTP_PORT: 8080
    env_file:
      - path: .env
        required: false
    ports:
      - "127.0.0.1:${WHATSAPP_HTTP_PORT:-8086}:8080"   # webhook Meta Cloud API
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  call-service:
    build:
      context: .
      dockerfile: services/call-service/Dockerfile
    container_name: ai-admin-call
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-aiadmin}:${POSTGRES_PASSWORD:-aiadmin_dev}@postgres:5432/${POSTGRES_DB:-aiadmin}
      SERVICE_NAME: call-service
      CALL_API_TOKEN: ${CALL_API_TOKEN:-}
      CALL_API_PORT: 8080
      YC_API_KEY: ${YC_API_KEY:-}
      YC_FOLDER_ID: ${YC_FOLDER_ID:-}
      SIP_LOGIN: ${SIP_LOGIN:-}
      SIP_PASSWORD: ${SIP_PASSWORD:-}
    env_file:
      - path: .env
        required: false
    ports:
      - "127.0.0.1:${CALL_HTTP_PORT:-8081}:8080"   # API звонков
      - "127.0.0.1:${CALL_HEALTH_PORT:-8085}:8081" # /health и /metrics
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: services/worker/Dockerfile
    container_name: ai-admin-worker
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-aiadmin}:${POSTGRES_PASSWORD:-aiadmin_dev}@postgres:5432/${POSTGRES_DB:-aiadmin}
      SERVICE_NAME: worker
      # порт внутри контейнера; наружу — WORKER_HEALTH_PORT
      WORKER_HTTP_PORT: 8084
      WORKER_TICK: ${WORKER_TICK:-60}
      OWNER_TG_CHAT_ID: ${OWNER_TG_CHAT_ID:-}
    env_file:
      - path: .env
        required: false
    ports:
      - "127.0.0.1:${WORKER_HEALTH_PORT:-8084}:8084"  # /health и /metrics
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  cli:
    build:
      context: .
      dockerfile: services/cli/Dockerfile
    container_name: ai-admin-cli
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-aiadmin}:${POSTGRES_PASSWORD:-aiadmin_dev}@postgres:5432/${POSTGRES_DB:-aiadmin}
      SERVICE_NAME: cli
      MIGRATIONS_DIR: /app/migrations
    env_file:
      - path: .env
        required: false
    depends_on:
      postgres:
        condition: service_healthy
    profiles: ["tools"]     # не запускается в общем стеке: только docker compose run --rm cli
    stdin_open: true
    tty: true

  prometheus:
    image: prom/prometheus:latest
    container_name: ai-admin-prometheus
    # Отдельный профиль: метрики полезны не всем и занимают память.
    # Запуск: docker compose --profile monitoring up -d
    profiles: ["monitoring"]
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
      - promdata:/prometheus
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"
    # Порты сервисов наружу закрыты, поэтому ходим к ним по внутренней сети.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=${PROM_RETENTION:-15d}

  alertmanager:
    image: prom/alertmanager:latest
    container_name: ai-admin-alertmanager
    # Вместе с Prometheus: без него правила срабатывают, но никому не сообщают.
    profiles: ["monitoring"]
    volumes:
      - ./monitoring/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertdata:/alertmanager
    ports:
      - "127.0.0.1:${ALERTMANAGER_PORT:-9093}:9093"
    depends_on:
      - alert-relay
    restart: unless-stopped

  alert-relay:
    build:
      context: .
      dockerfile: services/alert-relay/Dockerfile
    container_name: ai-admin-alert-relay
    # Мост между Alertmanager и Telegram: сам Alertmanager в Telegram ходить
    # не умеет (api.telegram.org с этой машины закрыт, есть только Worker).
    profiles: ["monitoring"]
    environment:
      # Значения берутся из .env; сам токен в git не попадает.
      TG_ALERT_API_BASE: ${TG_ALERT_API_BASE:-}
      TG_ALERT_TOKEN: ${TG_ALERT_TOKEN:-}
      TG_ALERT_CHAT_ID: ${TG_ALERT_CHAT_ID:-}
      ALERT_RELAY_PORT: "8086"
    ports:
      # 8086 занят на машине разработчика, поэтому наружу отдаём 8087 (localhost).
      - "127.0.0.1:${ALERT_RELAY_PORT:-8087}:8086"
    env_file:
      - path: .env
        required: false
    restart: unless-stopped

volumes:
  pgdata:
  promdata:
  alertdata:
