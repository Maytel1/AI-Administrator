# AI-администратор: локальный dev-стек (фаза 0). См. docker/README.md
# Запуск:  docker compose up -d      Стоп: docker compose down (данные БД остаются)
name: ai-admin

services:
  postgres:
    image: postgres:16-alpine
    container_name: ai-admin-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-aiadmin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aiadmin_dev}
      POSTGRES_DB: ${POSTGRES_DB:-aiadmin}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8"
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aiadmin} -d ${POSTGRES_DB:-aiadmin}"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  bot-service:
    build:
      context: .
      dockerfile: services/bot-service/Dockerfile
    container_name: ai-admin-bot
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-aiadmin}:${POSTGRES_PASSWORD:-aiadmin_dev}@postgres:5432/${POSTGRES_DB:-aiadmin}
      SERVICE_NAME: bot-service
    env_file:
      - path: .env
        required: false
    ports:
      - "${BOT_HTTP_PORT:-8080}:8080"   # webhook-эндпоинт появится в фазе 2
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: services/web/Dockerfile
    container_name: ai-admin-web
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-aiadmin}:${POSTGRES_PASSWORD:-aiadmin_dev}@postgres:5432/${POSTGRES_DB:-aiadmin}
      SERVICE_NAME: web
      WEB_HTTP_PORT: 8080
      MIGRATIONS_DIR: /app/migrations
      # TLS: сертификаты кладём через docker/certs (в git не попадают).
      # Без них панель работает по http — только для локальной отладки.
      WEB_TLS_CERT: ${WEB_TLS_CERT:-}
      WEB_TLS_KEY: ${WEB_TLS_KEY:-}
      WEB_TRUST_PROXY: ${WEB_TRUST_PROXY:-0}
    env_file:
      - path: .env
        required: false
    volumes:
      - ./certs:/app/certs:ro
    ports:
      - "${WEB_HTTP_PORT:-8082}:8080"      # панель: http://localhost:8082/today
      - "${WEB_HEALTH_PORT:-8083}:8081"   # /health и /metrics соседним портом
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  call-service:
    build:
      context: .
      dockerfile: services/call-service/Dockerfile
    container_name: ai-admin-call
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-aiadmin}:${POSTGRES_PASSWORD:-aiadmin_dev}@postgres:5432/${POSTGRES_DB:-aiadmin}
      SERVICE_NAME: call-service
      CALL_API_TOKEN: ${CALL_API_TOKEN:-}
      CALL_API_PORT: 8080
      YC_API_KEY: ${YC_API_KEY:-}
      YC_FOLDER_ID: ${YC_FOLDER_ID:-}
      SIP_LOGIN: ${SIP_LOGIN:-}
      SIP_PASSWORD: ${SIP_PASSWORD:-}
    env_file:
      - path: .env
        required: false
    ports:
      - "${CALL_HTTP_PORT:-8081}:8080"   # API звонков
      - "${CALL_HEALTH_PORT:-8085}:8081" # /health и /metrics
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: services/worker/Dockerfile
    container_name: ai-admin-worker
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-aiadmin}:${POSTGRES_PASSWORD:-aiadmin_dev}@postgres:5432/${POSTGRES_DB:-aiadmin}
      SERVICE_NAME: worker
      # порт внутри контейнера; наружу — WORKER_HEALTH_PORT
      WORKER_HTTP_PORT: 8084
      WORKER_TICK: ${WORKER_TICK:-60}
      OWNER_TG_CHAT_ID: ${OWNER_TG_CHAT_ID:-}
    env_file:
      - path: .env
        required: false
    ports:
      - "${WORKER_HEALTH_PORT:-8084}:8084"  # /health и /metrics
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  cli:
    build:
      context: .
      dockerfile: services/cli/Dockerfile
    container_name: ai-admin-cli
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-aiadmin}:${POSTGRES_PASSWORD:-aiadmin_dev}@postgres:5432/${POSTGRES_DB:-aiadmin}
      SERVICE_NAME: cli
      MIGRATIONS_DIR: /app/migrations
    env_file:
      - path: .env
        required: false
    depends_on:
      postgres:
        condition: service_healthy
    profiles: ["tools"]     # не запускается в общем стеке: только docker compose run --rm cli
    stdin_open: true
    tty: true

volumes:
  pgdata:
