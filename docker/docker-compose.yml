# AI-администратор: локальный dev-стек (фаза 0). См. docker/README.md
# Запуск:  docker compose up -d      Стоп: docker compose down (данные БД остаются)
name: ai-admin

services:
  postgres:
    image: postgres:16-alpine
    container_name: ai-admin-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-aiadmin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aiadmin_dev}
      POSTGRES_DB: ${POSTGRES_DB:-aiadmin}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8"
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aiadmin} -d ${POSTGRES_DB:-aiadmin}"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  bot-service:
    build:
      context: .
      dockerfile: services/bot-service/Dockerfile
    container_name: ai-admin-bot
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-aiadmin}:${POSTGRES_PASSWORD:-aiadmin_dev}@postgres:5432/${POSTGRES_DB:-aiadmin}
      SERVICE_NAME: bot-service
    env_file:
      - path: .env
        required: false
    ports:
      - "${BOT_HTTP_PORT:-8080}:8080"   # webhook-эндпоинт появится в фазе 2
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: services/web/Dockerfile
    container_name: ai-admin-web
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-aiadmin}:${POSTGRES_PASSWORD:-aiadmin_dev}@postgres:5432/${POSTGRES_DB:-aiadmin}
      SERVICE_NAME: web
      WEB_HTTP_PORT: 8080
      MIGRATIONS_DIR: /app/migrations
    env_file:
      - path: .env
        required: false
    ports:
      - "${WEB_HTTP_PORT:-8082}:8080"      # панель: http://localhost:8082/today
      - "${WEB_HEALTH_PORT:-8083}:8081"   # /health и /metrics соседним портом
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  call-service:
    build: ./services/call-service
    container_name: ai-admin-call
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-aiadmin}:${POSTGRES_PASSWORD:-aiadmin_dev}@postgres:5432/${POSTGRES_DB:-aiadmin}
      SERVICE_NAME: call-service
    env_file:
      - path: .env
        required: false
    ports:
      - "${CALL_HTTP_PORT:-8081}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  worker:
    build: ./services/worker
    container_name: ai-admin-worker
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-aiadmin}:${POSTGRES_PASSWORD:-aiadmin_dev}@postgres:5432/${POSTGRES_DB:-aiadmin}
      SERVICE_NAME: worker
    env_file:
      - path: .env
        required: false
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  cli:
    build:
      context: .
      dockerfile: services/cli/Dockerfile
    container_name: ai-admin-cli
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-aiadmin}:${POSTGRES_PASSWORD:-aiadmin_dev}@postgres:5432/${POSTGRES_DB:-aiadmin}
      SERVICE_NAME: cli
      MIGRATIONS_DIR: /app/migrations
    env_file:
      - path: .env
        required: false
    depends_on:
      postgres:
        condition: service_healthy
    profiles: ["tools"]     # не запускается в общем стеке: только docker compose run --rm cli
    stdin_open: true
    tty: true

volumes:
  pgdata:
