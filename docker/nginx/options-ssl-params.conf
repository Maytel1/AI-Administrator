# Параметры TLS, принятые для административной панели (OWASP).
# TLS 1.2 и выше: TLS 1.0/1.1 сломаны и запрещены браузерами.
# Модули из nginx-образа (ssl_session_cache, ssl_buffers) не трогаем.

ssl_protocols TLSv1.2 TLSv1.3;
ssl_prefer_server_ciphers off;          # для TLS 1.3 шифры выбирает клиент
ssl_ciphers "ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305";

# Обмен ключами: ECDHE — вперёд, DHE отключаем (медленно и не нужно).
ssl_ecdh_curve X25519:prime256v1:secp384r1;

# OCSP stapling: браузер проверяет отзыв сертификата без лишнего запроса.
# Включаем только если сертификат выпущен публичным CA и chain загружен.
ssl_stapling on;
ssl_stapling_verify on;
ssl_trusted_certificate /etc/nginx/certs/fullchain.pem;
resolver 127.0.0.11 valid=300s;   # DNS-резолвер docker-сети

ssl_session_cache shared:SSL:10m;
ssl_session_timeout 1d;
ssl_session_tickets off;           # ticket'ы отключаем: ключи живут дольше сессии
