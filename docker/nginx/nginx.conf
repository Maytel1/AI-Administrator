# TLS termination для панели «Дежурный24».
#
# Схема: браузер → nginx (443, сертификат) → web:8080 по внутренней сети.
# Наружу отдаётся только nginx: порты панели в проде не публикуются.
#
# Перед включением проверьте, что домен из $host указывает на этот сервер,
# а сертификат лежит в docker/certs (fullchain.pem + privkey.pem).

limit_req_zone $binary_remote_addr zone=panel_login:10m rate=10r/m;

upstream panel_web {
    server web:8080;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name _;

    # ACME-челлендж (Let's Encrypt) должен работать и по http.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Остальное — сразу на HTTPS. Здесь мы ещё не знаем, что сертификат есть,
    # поэтому редирект на _default_, а не на $host из заголовка.
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    include /etc/nginx/snippets/options-ssl-params.conf;

    # Панель — это ПДн клиентов: лишнее не отдаём и не кэшируем.
    #
    # Заголовки безопасности ставит веб-сервис, и дублировать их здесь не
    # нужно: nginx и веб добавляли каждый свой, и в ответе приходили два
    # одинаковых заголовка — сканеры считают это ошибкой конфигурации.
    # HSTS тоже не дублируем: его ставит веб (он знает, что соединение
    # действительно защищено, и в тексте HSTS один).
    #
    # Что остаётся за nginx: тело запросов крошечное (формы панели).
    client_max_body_size 64k;
    client_body_timeout 10s;

    # Формы панели ходят на /actions и /login — именно их ограничиваем.
    location = /login {
        limit_req zone=panel_login burst=5 nodelay;
        proxy_pass http://panel_web;
        include /etc/nginx/proxy_params_default;
    }

    location / {
        proxy_pass http://panel_web;
        include /etc/nginx/proxy_params_default;
    }

    # /health и /metrics наружу не отдаём: их видит только внутренняя сеть.
    location ~ ^/(health|metrics)$ {
        return 404;
    }
}
