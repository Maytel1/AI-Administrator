[pytest]
asyncio_mode = auto
testpaths = tests

# Минимальный порог покрытия: 60%. Число ниже не «идеальная метрика»,
# а способ заметить модуль, который забыли протестировать совсем.
# Поднять на 5% дешевле, чем потом разбираться, почему сервис упал в проде.
addopts = --cov=admin_core --cov-report=term-missing:skip-covered --cov-fail-under=60
