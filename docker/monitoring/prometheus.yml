# Prometheus: сбор метрик сервисов и правила алертов.
#
# Запуск: docker compose --profile monitoring up -d
# Веб-интерфейс: http://localhost:9090  (в проде порт наружу не публикуем).
#
# Порты в job'ах — внутренние health-порты сервисов из docker-compose.yml:
# бот 8080, панель 8083, worker 8084, автоответчик 8085. Наружу они закрыты,
# поэтому Prometheus ходит к ним по внутренней сети compose.

global:
  scrape_interval: 15s
  evaluation_interval: 30s
  external_labels:
    project: dezhurny24

rule_files:
  - /etc/prometheus/alerts.yml

# Alertmanager живёт на :9093: он и принимает алерты, и решает, что и когда
# слать. Наш alert-relay — только транспорт до Telegram.
alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]
      timeout: 10s

scrape_configs:
  - job_name: services
    metrics_path: /metrics
    static_configs:
      # Порты ВНУТРИ контейнеров, а не хостовые: 8083/8085 — это пробросы
      # наружу для локальной проверки, Prometheus идёт по внутренней сети.
      - targets: ["bot-service:8080", "web:8081", "worker:8084", "call-service:8081"]
        labels:
          stack: ai-admin

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # Контур мониторинга тоже должен быть в мониторинге: если Alertmanager или
  # релей упали, алерты не уйдут — а без их метрик никто об этом не узнает,
  # и тишина станет неотличима от «всё спокойно».
  - job_name: monitoring
    static_configs:
      - targets: ["alertmanager:9093", "alert-relay:8086"]
        labels:
          stack: monitoring